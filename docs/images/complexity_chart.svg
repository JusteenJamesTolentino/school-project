<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background: #0f172a; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="redArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="425" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Database Round-Trips &amp; Time Complexity</text>
  <text x="425" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Legacy N+1 Queries (O(N)) vs. Single Relational JOIN + Hash Group-by (O(1))</text>

  <!-- Plot Area Boundaries: x: 90 to 770, y: 100 to 390 -->
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
    <line x1="90" y1="110" x2="770" y2="110" />
    <line x1="90" y1="166" x2="770" y2="166" />
    <line x1="90" y1="222" x2="770" y2="222" />
    <line x1="90" y1="278" x2="770" y2="278" />
    <line x1="90" y1="334" x2="770" y2="334" />
  </g>
  <line x1="90" y1="390" x2="770" y2="390" stroke="#64748b" stroke-width="1.5" />
  <line x1="90" y1="100" x2="90" y2="390" stroke="#64748b" stroke-width="1.5" />

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="end">
    <text x="80" y="114">1,000</text>
    <text x="80" y="170">800</text>
    <text x="80" y="226">600</text>
    <text x="80" y="282">400</text>
    <text x="80" y="338">200</text>
    <text x="80" y="394">0</text>
  </g>
  <text x="32" y="245" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 32 245)">Database Round-Trips</text>

  <!-- X-Axis Labels -->
  <g fill="#94a3b8" font-size="13" text-anchor="middle">
    <text x="150" y="414">N = 10</text>
    <text x="280" y="414">N = 50</text>
    <text x="410" y="414">N = 100</text>
    <text x="570" y="414">N = 500</text>
    <text x="730" y="414">N = 1,000</text>
  </g>
  <text x="430" y="445" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Entity Count (N)</text>

  <!-- Legacy N+1 Polygon & Line -->
  <polygon points="150,387 280,376 410,362 570,250 730,110 730,390 150,390" fill="url(#redArea)" />
  <polyline points="150,387 280,376 410,362 570,250 730,110" fill="none" stroke="url(#redGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Legacy Data Dots & Labels -->
  <circle cx="150" cy="387" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="280" cy="376" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="410" cy="362" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="570" cy="250" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="730" cy="110" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

  <text x="570" y="234" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">501 queries</text>
  <text x="730" y="94" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">1,001 queries (O(N))</text>

  <!-- Optimized O(1) Line & Dots -->
  <line x1="150" y1="388" x2="730" y2="388" stroke="url(#greenGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="150" cy="388" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <circle cx="280" cy="388" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <circle cx="410" cy="388" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <circle cx="570" cy="388" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <circle cx="730" cy="388" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <text x="730" y="372" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">1 query (O(1) Constant)</text>

  <!-- Legend Box -->
  <g transform="translate(110, 115)">
    <rect width="320" height="82" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Red line legend -->
    <line x1="15" y1="26" x2="45" y2="26" stroke="#ef4444" stroke-width="3" />
    <circle cx="30" cy="26" r="4" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
    <text x="55" y="30" fill="#f8fafc" font-size="13" font-weight="600">Legacy N+1: O(N) DB Round-trips</text>
    <text x="55" y="46" fill="#94a3b8" font-size="11.5">1 initial SELECT + N sequential child queries</text>

    <!-- Green line legend -->
    <line x1="15" y1="64" x2="45" y2="64" stroke="#10b981" stroke-width="3" />
    <circle cx="30" cy="64" r="4" fill="#10b981" stroke="#fff" stroke-width="1.5" />
    <text x="55" y="68" fill="#34d399" font-size="13" font-weight="600">Optimized: O(1) Single-Pass JOIN</text>
  </g>
</svg>
